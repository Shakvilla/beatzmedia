# Trivy vulnerability ignore list (YAML format — supports mechanical expiry).
#
# Every entry MUST carry a justification (`statement`) and an `expired_at` date so
# suppressions cannot rot silently: once the date passes, Trivy stops honouring the
# entry and the gate fails again, forcing a re-review.
#
# Wired into the image-scan gate via the `trivyignores:` input in
# .github/workflows/security.yml. Keep this list as small as possible.
#
# 2026-08-18: EMPTY — nothing is suppressed. All four previous entries
# (CVE-2026-11940, CVE-2026-15308, CVE-2026-58016, CVE-2026-54369) were base-image
# OS packages awaiting a Red Hat UBI9 rebuild. Bumping Dockerfile.jvm to
# openjdk-25-runtime 1.24-3.1786536503 satisfied every stated removal condition, so
# the entries were deleted rather than re-dated. Prefer bumping the base image over
# renewing a suppression: an expiry date that keeps moving is a suppression that has
# stopped being temporary.

vulnerabilities: []

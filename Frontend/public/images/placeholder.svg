<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="No cover art">
  <!--
    Fallback cover art. The stored path used to be /images/placeholder.jpg, which never existed —
    public/images/ was not in the repo at all — so every track without real artwork rendered as a
    BROKEN image rather than a neutral one.

    SVG rather than a JPEG: it is text (reviewable in a diff), a couple of KB, and stays sharp from
    a 40px track row to a 600px hero without shipping multiple sizes.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#g)"/>
  <g fill="none" stroke="#71717a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M243 372V214l132-30v158"/>
    <circle cx="213" cy="372" r="30"/>
    <circle cx="345" cy="342" r="30"/>
  </g>
</svg>

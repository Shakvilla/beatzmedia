<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{title}</title></head>
<body style="margin:0;padding:0;background:#090b0a;color:#f4f7f4;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{title}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#090b0a;padding:36px 12px;"><tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#111512;border:1px solid #263128;border-radius:18px;overflow:hidden;">
      <tr><td style="padding:30px 36px 24px;border-bottom:1px solid #263128;"><div style="font-size:20px;font-weight:800;color:#f4f7f4;">BEATZ<span style="color:#b6f34a;">CLIK</span></div><div style="margin-top:8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#9aa59b;">Music. Community. Ownership.</div></td></tr>
      <tr><td style="padding:34px 36px 38px;"><div style="display:inline-block;padding:7px 10px;border-radius:999px;background:#1c2a1b;color:#b6f34a;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">BeatzClik update</div>
        <h1 style="margin:20px 0 12px;font-size:26px;line-height:1.25;color:#f4f7f4;">{title}</h1>
        <div style="color:#c0c9c1;font-size:15px;line-height:1.7;white-space:pre-line;">{body}</div>
        {#if actionUrl}<table role="presentation" cellspacing="0" cellpadding="0" style="margin:28px 0 8px;"><tr><td style="border-radius:10px;background:#b6f34a;"><a href="{actionUrl}" style="display:inline-block;padding:15px 22px;color:#10140d;text-decoration:none;font-size:14px;font-weight:800;">View in BeatzClik</a></td></tr></table>{/if}
      </td></tr>
    </table>
    <p style="margin:18px 0 0;color:#748078;font-size:11px;line-height:1.6;">BeatzClik · You received this because email notifications are enabled for your account.</p>
  </td></tr></table>
</body>
</html>

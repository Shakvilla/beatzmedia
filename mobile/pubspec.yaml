name: beatzclik_fan
description: BeatzClik Fan Mobile — Ghanaian and African music discovery, buy-to-own, playback and offline.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.3
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.4.8
  json_serializable: ^6.8.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
